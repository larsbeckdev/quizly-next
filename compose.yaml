services:
  api:
    build: ./backend
    ports:
      - "${API_PORT:-3070}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DJANGO_CORS_ALLOW_ALL_ORIGINS: ${DJANGO_CORS_ALLOW_ALL_ORIGINS:-True}
      DJANGO_TRUST_PROXY_SSL_HEADER: ${DJANGO_TRUST_PROXY_SSL_HEADER:-0}
      DJANGO_AUTH_COOKIE_SECURE: ${DJANGO_AUTH_COOKIE_SECURE:-False}
      DJANGO_AUTH_COOKIE_SAMESITE: ${DJANGO_AUTH_COOKIE_SAMESITE:-Lax}
      DJANGO_DB_PATH: /data/db.sqlite3
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      # Whisper downloads its model into $XDG_CACHE_HOME/whisper. On the
      # volume it survives rebuilds instead of being fetched again.
      XDG_CACHE_HOME: /data/cache
    volumes:
      - ./data:/data
    # A quiz is generated inside the request and can take minutes, so the
    # worker timeout is far above the gunicorn default of 30 seconds.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000
             --workers ${GUNICORN_WORKERS:-2}
             --timeout ${GUNICORN_TIMEOUT:-900}"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Build time values: they are inlined into the client bundle, so a
        # change here needs docker compose build, not just a restart.
        NEXT_PUBLIC_API_PORT: ${API_PORT:-3070}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-3071}:3000"
    depends_on:
      - api
    restart: unless-stopped
